<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebNail</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hero-base:            #04050c;
    --heading:              #eef0f6;
    --body-muted:           #b9becf;
    --glass-fill:           rgba(255,255,255,0.08);
    --glass-fill-strong:    rgba(255,255,255,0.14);
    --glass-border:         rgba(255,255,255,0.16);
    --glass-border-strong:  rgba(255,255,255,0.28);
    --accent-cyan:          #6fe3ff;
    --accent-violet:        #b18bff;
    --panel-bg:             #0a0b14;
    --panel-line:           rgba(255,255,255,0.09);
    --action-inverse:       #ffffff;
    --action-inverse-fg:    #2f2f33;
    --duration-fast: 150ms;
    --ease-entrance: cubic-bezier(0.2, 0, 0, 1);
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 22rem;
    font-family: "Onest", sans-serif;
    background: var(--hero-base);
    color: var(--heading);
    position: relative;
    overflow: hidden;
  }
  .glow-bg {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(111,227,255,0.16), transparent 65%),
      radial-gradient(55% 50% at 90% 10%, rgba(177,139,255,0.14), transparent 65%);
  }
  .wrap { position: relative; z-index: 1; padding: 1.1rem; }

  .brand-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; }
  .brand-row svg { width: 1.15rem; height: 1.15rem; stroke: var(--heading); flex-shrink: 0; }
  .brand-row span { font-weight: 600; font-size: 0.98rem; letter-spacing: -0.01em; }
  .brand-row .tag { margin-left: auto; font-size: 0.62rem; color: var(--body-muted); border: 1px solid var(--glass-border); border-radius: 9999px; padding: 0.2rem 0.55rem; }

  .site-card {
    border: 1px solid var(--panel-line); border-radius: 0.9rem; background: var(--panel-bg);
    padding: 0.6rem 0.7rem; display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem;
  }
  .site-card .favicon { width: 1.5rem; height: 1.5rem; border-radius: 0.35rem; background: var(--glass-fill); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .site-card .favicon img { width: 100%; height: 100%; object-fit: cover; }
  .site-card .meta { min-width: 0; }
  .site-card .title { font-size: 0.78rem; color: var(--heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site-card .url { font-size: 0.68rem; color: var(--body-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .preview-frame {
    border-radius: 0.9rem; border: 1px solid var(--panel-line); background: var(--panel-bg);
    padding: 0.6rem; margin-bottom: 0.9rem; position: relative; overflow: hidden;
  }
  .preview-frame .mini-bar { display: flex; gap: 0.3rem; margin-bottom: 0.55rem; }
  .preview-frame .mini-bar span { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .preview-frame .mini-page { position: relative; border-radius: 0.55rem; background: rgba(255,255,255,0.03); padding: 0.7rem; min-height: 6rem; }
  .preview-frame .mini-page .pline { height: 0.35rem; border-radius: 0.2rem; background: rgba(255,255,255,0.1); margin-bottom: 0.4rem; }
  .preview-frame .mini-page .pline.short { width: 45%; }
  .preview-frame .mini-page .prow { display: flex; gap: 0.35rem; margin-top: 0.4rem; }
  .preview-frame .mini-page .pblock { flex: 1; height: 1.7rem; border-radius: 0.3rem; background: rgba(255,255,255,0.06); }
  .preview-frame .selbox {
    position: absolute; top: 1.9rem; left: 1.1rem; width: 55%; height: 2.1rem;
    border: 1.5px dashed var(--accent-cyan); border-radius: 0.3rem; background: rgba(111,227,255,0.1);
  }

  .status-line { font-size: 0.72rem; color: var(--body-muted); margin-bottom: 0.75rem; min-height: 1rem; }
  .status-line.active { color: var(--accent-cyan); }

  .btn-row { display: flex; gap: 0.5rem; }
  .pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    height: 2.5rem; border-radius: 9999px; background: var(--action-inverse);
    font-size: 0.82rem; font-weight: 500; color: var(--action-inverse-fg);
    border: none; cursor: pointer;
    transition: background var(--duration-fast) var(--ease-entrance);
  }
  .pill:hover { background: rgba(255,255,255,0.85); }
  .pill:disabled { opacity: 0.5; cursor: not-allowed; }
  .pill-ghost {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    height: 2.5rem; border-radius: 9999px; background: var(--glass-fill);
    border: 1px solid var(--glass-border-strong);
    font-size: 0.82rem; font-weight: 500; color: var(--heading); cursor: pointer;
    transition: background var(--duration-fast) var(--ease-entrance);
  }
  .pill-ghost:hover { background: var(--glass-fill-strong); }
  .pill svg, .pill-ghost svg { width: 0.95rem; height: 0.95rem; }

  .modes { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
  .mode-chip {
    flex: 1; text-align: center; padding: 0.5rem 0.3rem; border-radius: 0.6rem;
    font-size: 0.68rem; color: var(--body-muted); border: 1px solid var(--panel-line);
    background: var(--panel-bg); cursor: pointer;
  }
  .mode-chip.active { color: var(--heading); border-color: var(--glass-border-strong); background: var(--glass-fill); }

  .footer-note { margin-top: 0.9rem; font-size: 0.65rem; color: var(--body-muted); text-align: center; line-height: 1.5; }
  .footer-note a { color: var(--accent-cyan); }
</style>
</head>
<body>
<div class="glow-bg" aria-hidden="true"></div>
<div class="wrap">
  <div class="brand-row">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2.5 9c2.5 0 2.5 4.2 5 4.2S10 9 12 9s2.5 4.2 5 4.2S19.5 9 21.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M2.5 15c2.5 0 2.5 4.2 5 4.2S10 15 12 15s2.5 4.2 5 4.2S19.5 15 21.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <span>WebNail</span>
    <span class="tag">Extension</span>
  </div>

  <div class="site-card">
    <div class="favicon"><img id="favicon" alt=""></div>
    <div class="meta">
      <div class="title" id="pageTitle">Loading…</div>
      <div class="url" id="pageUrl"></div>
    </div>
  </div>

  <div class="preview-frame">
    <div class="mini-bar"><span></span><span></span><span></span></div>
    <div class="mini-page">
      <div class="pline"></div>
      <div class="pline short"></div>
      <div class="prow"><div class="pblock"></div><div class="pblock"></div></div>
      <div class="selbox" id="selboxDemo"></div>
    </div>
  </div>

  <p class="status-line" id="statusLine">Ready — select on the page, or capture the whole thing.</p>

  <div class="btn-row">
    <button class="pill" id="selectBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h6v6H4V4zM14 14h6v6h-6v-6z"/></svg>
      Select on page
    </button>
    <button class="pill-ghost" id="fullBtn" type="button" title="Capture the whole page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Full page
    </button>
  </div>

  <div class="modes">
    <div class="mode-chip active" data-format="html">HTML/CSS</div>
    <div class="mode-chip" data-format="react">React</div>
  </div>

  <p class="footer-note">Selections are sent straight to your WebNail account. <a href="#" id="openSite">Open dashboard</a></p>
</div>
<script src="popup.js"></script>
</body>
</html>
